[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "supportguard"
version = "0.1.0"
description = "Interview-focused AI SaaS support Agent with grounded RAG and HITL safety."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "langchain-core>=0.3,<2",
  "langgraph>=0.6,<2",
  "langgraph-checkpoint-postgres>=2.0,<4",
  "mcp>=1.10,<2",
  "openai>=1.70,<3",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "orjson>=3.10,<4",
  "pgvector>=0.4,<1",
  "prometheus-client>=0.21,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-json-logger>=3.2,<5",
  "python-multipart>=0.0.20,<1",
  "pyjwt[crypto]>=2.10,<3",
  "redis>=5,<7",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
local-embeddings = [
  "sentence-transformers>=3.4,<6",
  "torch>=2.2,<3",
]

[dependency-groups]
build = [
  "hatchling>=1.27,<2",
]
dev = [
  "aiosqlite>=0.21,<1",
  "bandit>=1.8,<2",
  "httpx2>=2.5,<3",
  "mypy>=1.14,<2",
  "pip-audit>=2.7,<3",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "supportguard-validation==0.1.0",
]

[project.scripts]
supportguard = "supportguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/supportguard"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings --ignore=backend/tests/test_eval_v5_retrieval.py"
asyncio_mode = "auto"
testpaths = ["backend/tests"]
markers = [
  "mcp: real stdio MCP protocol contract tests",
  "postgres: real PostgreSQL integration tests",
  "redis: real Redis Streams integration tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend/src", "backend/tests", "validation/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["supportguard"]
mypy_path = "backend/src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["backend/tests"]

[tool.uv.sources]
supportguard-validation = { workspace = true }
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.uv.workspace]
members = ["validation"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
